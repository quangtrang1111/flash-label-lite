plugins {
    id 'com.android.application'
}

// Release signing comes from environment variables (set by CI from repository secrets).
// Without them the release build is signed with the local debug key.
def signingStore = System.getenv('SIGNING_STORE_FILE')

android {
    namespace 'com.lite.flashlabel'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.quangtrang.flashlabelite'
        minSdk 24
        targetSdk 35
        versionCode((System.getenv('VERSION_CODE') ?: '1').toInteger())
        versionName(System.getenv('VERSION_NAME') ?: '1.0')
    }

    signingConfigs {
        release {
            if (signingStore) {
                storeFile file(signingStore)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingStore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
        resValues false
        aidl false
        shaders false
    }
}
